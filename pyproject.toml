[project]
name = "nepal_compliance"
authors = [
    { name = "Yarsa Labs Pvt. Ltd.", email = "support@yarsalabs.com"}
]
description = "ERPNext app to comply with Nepali laws and regulations"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "qrcode[pil]",
    "PyPDF2>=3.0.0",
    "Pillow>=10.0.0"
    # frappe is installed and managed by bench; see tool.bench.frappe-dependencies.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.isort]
profile = "black"
known_frappe = "frappe"
known_erpnext = "erpnext"
known_hrms = "hrms"  
known_payment = "payments"
no_lines_before = ["ERPNEXT"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FRAPPE", "ERPNEXT", "HRMS", "PAYMENTS", "FIRSTPARTY", "LOCALFOLDER"]

[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
parameterized = "~=0.8.1"
time-machine = "~=2.10.0"

# This branch targets Frappe / ERPNext version 16. bench refuses to install it
# next to an older framework instead of failing later at runtime.
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
